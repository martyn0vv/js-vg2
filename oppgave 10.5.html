    <h2>10.5 Lag brukernavn</h2>

    <script>
        function lagBrukernavn10(fornavn, etternavn) {
            return (fornavn[0] + fornavn[1] +
                    etternavn[0] + etternavn[1]).toLowerCase();
        }

        let fornavn10 = "Lise";
        let etternavn10 = "Presley";

        console.log(lagBrukernavn10(fornavn10, etternavn10));
    </script>

    <p>Se console</p>
