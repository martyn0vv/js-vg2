    <script>
        const res9 = document.querySelector("#res9");
        let teller9 = "";
        for (let i = 10; i >= 1; i--) {
            // teller 9 += i + ", "; // for alternativ 2
            teller9 += i;
            if (i > 1) {
                teller9 += ", ";
            } //alternativ 1
        }
        // teller9 = teller9.substring(0, teller9.length - 1); //alternativ 2
        res9.innerHTML = teller9;
     </script>

<h1>del 9,7</h1>

<script>
    const tall = [8, 3, 12, 1, 5];

    for (let i = 0; i < tall.length; i++) {
        for (let j = 0; j < tall.length; j++) {

            if (tall[i] < tall[j]) {
                let temp = tall[i];
                tall[i] = tall[j];
                tall[j] = temp;
            }

        }
    }

</script>
